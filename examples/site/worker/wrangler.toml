# merlionjs.com production deployment

name = "merjs"
main = "worker/worker.js"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "merlionjs.com", custom_domain = true }
]

[assets]
directory = "../public"

[build]
command = "cd ../../.. && zig build worker"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "merjs-docs"

[vars]
AI_BUDGET_ACCOUNT = "merlionjs-site-production"

[[services]]
binding = "AI_BUDGET_GUARD"
service = "merjs-ai-budget-guard"
