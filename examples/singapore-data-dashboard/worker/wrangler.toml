name = "merjs-sgdata"
main = "worker.js"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "sgdata.merlionjs.com", custom_domain = true }
]

[assets]
directory = "../public"

[build]
command = "cd ../../.. && zig build sgdata-worker"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]

[vars]
AI_BUDGET_ACCOUNT = "merlionjs-sgdata-production"

[[services]]
binding = "AI_BUDGET_GUARD"
service = "merjs-ai-budget-guard"
