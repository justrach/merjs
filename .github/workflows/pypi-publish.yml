name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.2.5)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/merlionjs
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          python3 -m unittest scripts/test_release_version.py
          if [ "${{ github.event_name }}" = "release" ]; then
            python3 scripts/validate-release-version.py --tag "$RELEASE_TAG"
          else
            python3 scripts/validate-release-version.py --version "$DISPATCH_VERSION"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install build twine

      - name: Test package
        working-directory: packages/pypi
        run: python -m unittest discover -s tests -v

      - name: Build package
        working-directory: packages/pypi
        run: python -m build

      - name: Validate package
        run: python -m twine check packages/pypi/dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/pypi/dist/
