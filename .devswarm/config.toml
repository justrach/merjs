# DevSwarm configuration
# Generated by: devswarm init
# Re-generate: devswarm init --force
#
# Safe to commit to git (no secrets, no API keys).
# Per-repo (.devswarm/config.toml) overrides global (~/.config/devswarm/config.toml).

[provider]
# Primary agent backend: claude | codex | amp | auto
# "auto" picks whichever is available (claude preferred).
primary = "codex"

# Codex subscription tier: none | plus | pro | api
codex_tier = "pro"

# Default model for Codex backend
codex_default = "codex-mini-latest"

[provider.quota]
# Conservative request budgets per rolling hour window (0 = disabled).
claude_limit    = 900
codex_limit     = 1500
warn_at_percent = 80

[agents]
# Maximum parallel worker threads in a swarm run.
max_threads = 8
# Maximum swarm nesting depth (1 = flat, no sub-swarms).
max_depth   = 1

# Per-role overrides — uncomment and adjust as needed.
# [agents.finder]
# model   = "haiku"
# sandbox = "read-only"
#
# [agents.fixer]
# model   = "sonnet"
# sandbox = "write"
#
# [agents.reviewer]
# model   = "opus"
# sandbox = "read-only"
