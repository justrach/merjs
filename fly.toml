# fly.toml — Fly.io deployment config for merjs.
#
# Quick deploy:
#   flyctl launch --copy-config --no-deploy   # generate app name + region
#   flyctl deploy
#
# Fly automatically injects PORT — main.zig reads it. No code changes required.

app = "merjs"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/_mer/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
